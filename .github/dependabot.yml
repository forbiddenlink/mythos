version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      major-updates:
        patterns: ["*"]
        # typescript rides alone: no released typescript-eslint supports TS 7
        # (8.69.0 peers ">=4.8.4 <6.1.0"), so grouping it blocks every other major.
        exclude-patterns: ["typescript"]
        update-types: ["major"]
    ignore:
      # eslint-plugin-react 7.37.5 is the latest release and peers eslint
      # "^3 || ... || ^9.7". Under ESLint 10 its react/display-name rule throws
      # `contextOrFilename.getFilename is not a function` and every lint run
      # dies. Drop this once the plugin ships ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps):"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps):"
