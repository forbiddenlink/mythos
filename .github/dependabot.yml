version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      major-updates:
        patterns: ["*"]
        # typescript rides alone: no released typescript-eslint supports TS 7
        # (8.69.0 peers ">=4.8.4 <6.1.0"), so grouping it blocks every other major.
        exclude-patterns: ["typescript"]
        update-types: ["major"]
    ignore:
      # eslint-plugin-react 7.37.5 is the latest release and peers eslint
      # "^3 || ... || ^9.7". Under ESLint 10 its react/display-name rule throws
      # `contextOrFilename.getFilename is not a function` and every lint run
      # dies. Drop this once the plugin ships ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Same reason as the exclude-patterns above: no released typescript-eslint
      # supports TS 7, so the lint job fails outright on any TS 7 PR. Drop this
      # once typescript-eslint peers allow TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @tanstack/react-table v9 is a rewrite, not a bump: useReactTable ->
      # useTable, get*RowModel -> create*RowModel factories, features composed
      # explicitly, ColumnDef gains type args. DeitiesTable.tsx is the only
      # consumer and has no tests, so a type-clean port would still ship
      # unverified sorting, filtering and pagination. Stay on v8 until that
      # migration is done deliberately with coverage.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps):"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps):"
