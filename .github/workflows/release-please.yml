name: Release Please

on:
  push:
    branches:
      - main

# GITHUB_TOKEN cannot create GitHub Releases in this repo
# ("Resource not accessible by integration"). Store a PAT or
# GitHub App token with contents:write + pull-requests:write
# as RELEASE_PLEASE_TOKEN. Falls back to GITHUB_TOKEN locally.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
