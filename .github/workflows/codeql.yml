name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  call:
    permissions:
      actions: read
      contents: read
      security-events: write
    # Pin to commit SHA (not @main) for supply-chain safety
    uses: forbiddenlink/.github/.github/workflows/codeql.yml@2606e52c5ea220c9cf669715ca91e18da20f9eaa
