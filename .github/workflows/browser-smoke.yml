name: Reader browser smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1"

permissions:
  contents: read

concurrency:
  group: reader-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-journeys:
    name: Firefox and WebKit reader journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      E2E_PORT: "3108"
      QA_ALL_BROWSERS: "true"
      SKIP_BUILD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines and system dependencies
        run: pnpm --filter web exec playwright install --with-deps firefox webkit

      - name: Build for reader journeys
        run: pnpm --filter web build

      # Reuse the existing regression cases instead of a second smoke implementation.
      # These exercise local learning data and simulated sharing, with no live sends.
      - name: Read, search, save, review, export, restore and share
        run: >-
          pnpm --filter web exec playwright test
          e2e/progress-tracking.spec.ts
          e2e/search-functionality.spec.ts
          e2e/story-source-reading.spec.ts
          e2e/learning-recovery.spec.ts
          e2e/learning-backup.spec.ts
          e2e/sharing-recovery.spec.ts
          --project=firefox --project=webkit
          --grep='First reading visit|should navigate to result on selection|offers direct reading and one optional narration interface|failed local saves remain recoverable|stages and restores a valid backup|clipboard failure offers a real recovery|successful .* copying reports success'

      - name: Upload failure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: reader-browser-smoke
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
