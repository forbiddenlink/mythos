services:
  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_USER: mythos
      POSTGRES_PASSWORD: mythos
      POSTGRES_DB: mythos_atlas
    ports:
      - "5435:5432"
    volumes:
      - mythos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mythos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mythos_db:
