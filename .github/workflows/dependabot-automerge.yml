name: Dependabot auto-merge
# CI-gated: waits for the repo's CI workflow to pass on the PR's head SHA, then
# squash-merges patch + minor dependabot PRs. Major updates stay manual.
# Runs on pull_request, not pull_request_target (blocked by default in public repos
# from 2026-12-02). Dependabot pull_request runs honor the job-level permissions.
# Gated on the PR author plus a same-repo head; no PR code is checked out or executed.
on: pull_request
permissions: {}
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for CI, then merge (patch + minor only)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI on $SHA ..."
          for i in $(seq 1 90); do
            state=""
            for workflow in ci.yml test.yml build.yml; do
              state=$(gh run list --repo "$REPO" --workflow="$workflow" --commit "$SHA" \
                        --json status,conclusion \
                        --jq '.[0] // empty | "\(.status)/\(.conclusion)"' 2>/dev/null || true)
              [ -n "$state" ] && break
            done
            case "$state" in
              completed/success)
                echo "CI green -> merging"
                gh pr merge --squash --delete-branch --match-head-commit "$SHA" "$PR_URL"
                exit 0 ;;
              completed/*)
                echo "CI not green ($state) -> leaving PR open for review"
                exit 0 ;;
              *)
                sleep 20 ;;
            esac
          done
          echo "Timed out waiting for CI (30 min); leaving PR open."
