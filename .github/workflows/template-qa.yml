name: Template QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/template-qa.yml"

permissions:
  contents: read

concurrency:
  group: template-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: All templates · shard ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: "true"
      AUDIT_BASE_URL: "http://localhost:3118"
      AUDIT_RUN_LABEL: ci-${{ github.run_id }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web build:ci
      - name: Check all page templates in both themes at three widths
        shell: bash
        run: |
          pnpm --filter web start --port 3118 > /tmp/template-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent "$AUDIT_BASE_URL" > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/template-qa-server.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent "$AUDIT_BASE_URL" > /dev/null
          pnpm --filter web exec playwright test --config=audit/playwright.config.ts --shard=${{ matrix.shard }}/3
      # A route that froze and passed on its retry still leaves the job green,
      # so name it where a reader of the PR will see it.
      - name: Flag routes where the browser stopped answering
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          dir="functional-review/evidence/2026-10-18/$AUDIT_RUN_LABEL"
          for report in "$dir"/*.json; do
            line=$(jq -r 'select(.previousAttemptHang) | "\(.template.route) at \(.project): \(.previousAttemptHang)"' "$report")
            if [ -n "$line" ]; then
              echo "::warning title=Browser stopped answering, passed on retry::$line"
              echo "- Passed on retry: $line" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for marker in "$dir"/*.hang; do
            line="$(basename "$marker" .hang): $(cat "$marker")"
            echo "::warning title=Browser stopped answering::$line"
            echo "- Stopped answering: $line" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Save complete reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-qa-${{ matrix.shard }}
          path: |
            functional-review/evidence/2026-10-18/${{ env.AUDIT_RUN_LABEL }}/
            /tmp/template-qa-server.log
          retention-days: 14

  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Scan the lockfile against current registry advisories
        run: pnpm audit --json > dependency-audit.json
      - name: Save advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-advisories
          path: dependency-audit.json
          retention-days: 14
