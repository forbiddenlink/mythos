name: Visual regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Chromium · macOS 26 ARM64
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CI: "true"
      VISUAL_PORT: "3118"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm baseline platform
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked Chromium revision
        run: pnpm --filter web exec playwright install chromium

      - name: Build production application
        run: pnpm --filter web build:ci

      # Never update references in CI. If the hosted OS/font rendering changes,
      # inspect actual/expected/diff artifacts and review a new baseline on the
      # matching environment instead of increasing pixel tolerances.
      - name: Compare reviewed visual baselines
        run: pnpm --filter web visual

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-macos26-arm64
          path: |
            apps/web/playwright-report/visual/
            apps/web/visual-test-results/
          retention-days: 14
